name: Ανανέωση αγγελιών Intrum

on:
  # Τρέχει μόνο χειροκίνητα (Actions → Run workflow).
  workflow_dispatch:
    inputs:
      minutes:
        description: "Μέγιστος χρόνος για σελίδες ακινήτων (λεπτά)"
        default: "300"

permissions:
  contents: write

concurrency:
  group: scrape-intrum
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Εγκατάσταση Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Συλλογή αγγελιών
        run: node scraper/scrape.js --minutes "${{ github.event.inputs.minutes || '300' }}" --concurrency 4

      - name: Αποθήκευση στο repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/listings.json
          if git diff --cached --quiet; then
            echo "Καμία αλλαγή."
          else
            git commit -m "Ανανέωση αγγελιών Intrum $(date -u +%Y-%m-%d)"
            git push
          fi
